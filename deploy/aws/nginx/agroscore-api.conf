# DEPLOY-AWS-1 — reverse proxy para api.agroscorelatam.com.
# Copiar a /etc/nginx/sites-available/agroscore-api.conf en la EC2 y
# symlinkear a sites-enabled (ver README.md paso 10). Certbot reescribe este
# archivo automáticamente para agregar el bloque SSL (listen 443, ssl_*,
# redirect 80→443) al correr `certbot --nginx` — no hace falta escribirlo a
# mano acá.
#
# Este proxy apunta SOLO al backend (127.0.0.1:3001, publicado así en
# docker-compose.prod.yml). Nunca proxyea al worker (:8000) ni a Postgres
# (:5432) — ninguno de los dos debe ser alcanzable desde fuera de la red
# interna de Docker.

server {
  listen 80;
  server_name api.agroscorelatam.com;

  client_max_body_size 25M;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300;
    proxy_connect_timeout 60;
    proxy_send_timeout 300;
  }
}
